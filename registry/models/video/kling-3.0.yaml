# yaml-language-server: $schema=../../schema/model.schema.json
id: kling-3.0
name: Kling 3.0
family: kling
vendor: kuaishou
description: Strong motion and physics, start/end frames, optional native audio, and up to 6 shots in one 15 s take.
output_type: video
status: active
license_tier: commercial_api
tags: [motion, physics, first-last-frame, audio]
prompt: {max_chars: 2500, dialect: kling, supports_negative: true, dialogue: true}
aspect_ratios: ["16:9", "9:16", "1:1"]
duration: {min: 3, max: 15, default: 5}

parameters:
  - {name: duration, label: Duration (s), type: int, min: 3, max: 15, default: 5, ui: slider,
     help: "A multi-shot take is as long as its shots together."}
  - {name: shots, label: Shots, type: shots, min_shots: 2, max_shots: 6, min_shot_s: 1, max_shot_s: 15,
     max_total_s: 15, modes: [multi_shot, multi_shot_frame]}
  - {name: resolution, type: enum, options: ["1080p"], default: "1080p", ui: segmented,
     help: "fal's Kling 3.0 pro endpoint renders 1080p only."}
  - {name: aspect_ratio, label: Aspect, type: enum, options: ["16:9", "9:16", "1:1"], default: "16:9", ui: aspect, modes: [t2v, multi_shot]}
  - {name: generate_audio, label: Native audio, type: bool, default: false}
  - {name: cfg_scale, label: Prompt adherence, type: float, min: 0, max: 1, step: 0.05, default: 0.5, group: advanced}
  - {name: seed, type: seed, group: advanced}

modes:
  - id: t2v
    label: Text to video
    ops: [t2v]
  - id: i2v
    label: Image to video
    ops: [i2v, flf2v]
    medias:
      - {role: start_image, kinds: [image], label: Start frame, required: true}
      - {role: end_image, kinds: [image], label: End frame}
  - id: multi_shot
    label: Multi-shot
    ops: [multi_shot]
    prompt: none  # the shots carry the prompts
  - id: multi_shot_frame
    label: Multi-shot from a frame
    ops: [multi_shot]
    prompt: none
    medias:
      - {role: start_image, kinds: [image], label: First frame, required: true}

elements: {strategy: keyframe_first}

routes:
  - id: kling-3.0@fal
    provider: fal
    modes:
      t2v: {endpoint: fal-ai/kling-video/v3/pro/text-to-video}
      i2v: {endpoint: fal-ai/kling-video/v3/pro/image-to-video}
      # multi_prompt replaces the prompt; "customize" keeps our shot lengths (verified 2026-10-06, fal OpenAPI)
      multi_shot: {endpoint: fal-ai/kling-video/v3/pro/text-to-video, fixed: {shot_type: customize}}
      multi_shot_frame: {endpoint: fal-ai/kling-video/v3/pro/image-to-video, fixed: {shot_type: customize}}
    map:
      params:
        duration: {to: duration, transform: str}   # fal takes "3".."15"
        shots: {to: multi_prompt, transform: shot_list, args: {duration: str}}   # [{prompt, duration: "1".."15"}]
        cfg_scale: cfg_scale
        generate_audio: generate_audio
        resolution: {to: null}   # the pro endpoint renders 1080p
        seed: {to: null}         # not accepted by Kling v3 on fal
      # field names verified 2026-10-06 against fal's per-endpoint OpenAPI
      media: {start_image: start_image_url, end_image: end_image_url}
    constraints:
      resolution: {options: ["1080p"]}
    pricing:
      basis: per_output_second
      rates:
        - {usd: 0.112}
        - {when: {generate_audio: true}, usd: 0.168}
      verified: 2026-10-06
      source: https://fal.ai/models/fal-ai/kling-video/v3/pro/image-to-video
    output: {path: video.url, kind: video}
    notes: fal's Pro tier renders 1080p. Multi-shot sends multi_prompt (up to 6 shots, 15 s in all).

examples:
  - name: t2v_smoke
    mode: t2v
    prompt: A red fox trots through fresh snow in a birch forest, morning light, slow tracking shot.
    params: {duration: 5, resolution: "1080p"}
    smoke: true
    expect: {cost_usd_range: [0.4, 1.0]}
  - name: multi_shot
    mode: multi_shot
    prompt: ""
    params:
      resolution: "1080p"
      shots:
        - {prompt: "Wide shot of a lighthouse on a cliff as a storm rolls in.", duration: 4}
        - {prompt: "Close-up of the keeper's hand turning the brass key.", duration: 3}
        - {prompt: "The lamp flares to life, beam sweeping the dark sea.", duration: 5}
    expect: {cost_usd_range: [1.0, 2.0]}
