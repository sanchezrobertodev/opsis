# yaml-language-server: $schema=../../schema/model.schema.json
# Fields and prices verified 2026-10-13 against fal's H3 queue OpenAPI and endpoint pages.
# fal: $0.05/s 480p, $0.06/s 768p; Replicate/MiniMax direct: $0.08/s 768p.
id: minimax-h3
name: MiniMax H3
family: minimax
vendor: minimax
description: >-
  MiniMax's audio-video model: text, a start frame, first and last frames, or up to five reference images.
  Native sound and dialogue are included. The default five-second 480p take costs $0.25 on fal.
output_type: video
status: active
license_tier: commercial_api
tags: [cinematic, budget, audio, references, first-last-frame]
prompt: {max_chars: 50000, dialect: default, supports_negative: false, dialogue: true}
aspect_ratios: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
duration: {min: 5, max: 15, default: 5}

parameters:
  - {name: duration, label: Duration (s), type: int, min: 5, max: 15, default: 5, ui: slider}
  - {name: resolution, type: enum, options: ["480p", "768p", "2k", "4k"], default: "480p", ui: segmented,
     help: "480p and 768p are native. 2K and 4K upscale a 768p result. Sound is included."}
  - {name: aspect_ratio, label: Aspect, type: enum, options: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"],
     default: "16:9", ui: aspect, modes: [t2v, reference]}
  - {name: prompt_expansion_mode, label: Prompt expansion, type: enum,
     options: [disabled, fast, balanced, quality], default: disabled, group: advanced,
     help: "Disabled keeps your prompt as written. Quality can add about 30 seconds."}
  - {name: seed, type: seed, group: advanced}

modes:
  - id: t2v
    label: Text to video
    ops: [t2v]
  - id: i2v
    label: Image to video
    ops: [i2v]
    medias:
      - {role: start_image, kinds: [image], label: Start frame, required: true}
  - id: flf2v
    label: First and last frame
    ops: [flf2v]
    medias:
      - {role: start_image, kinds: [image], label: First frame, required: true}
      - {role: end_image, kinds: [image], label: Last frame, required: true}
  - id: reference
    label: Reference images
    ops: [multi_ref]
    medias:
      # Stay within fal's five free images; additional images cost $0.08 each.
      - {role: image_references, kinds: [image], label: "Image refs (up to 5, included)", required: true, min: 1, max: 5}

elements: {strategy: refs_native, ref_role: image_references, max_refs: 5, token: "Image {n}"}

routes:
  - id: minimax-h3@fal
    provider: fal
    modes:
      t2v: {endpoint: minimax/h3/text-to-video}
      # Image endpoints follow the input frame's aspect and do not accept aspect_ratio.
      i2v: {endpoint: minimax/h3/image-to-video, drop: [aspect_ratio]}
      flf2v: {endpoint: minimax/h3/image-to-video, drop: [aspect_ratio]}
      reference: {endpoint: minimax/h3/reference-to-video}
    map:
      negative_prompt: null
      params:
        resolution: {to: resolution, transform: enum_map,
                     args: {values: {"480p": "480P", "768p": "768P", "2k": "2K", "4k": "4K"}}}
      media: {start_image: image_url, end_image: end_image_url, image_references: reference_image_urls}
    pricing:
      basis: per_output_second
      rates:
        - {when: {resolution: "480p"}, usd: 0.05}
        - {when: {resolution: "768p"}, usd: 0.06}
        - {when: {resolution: "2k"}, usd: 0.13}
        - {when: {resolution: "4k"}, usd: 0.16}
      verified: 2026-10-13
      source: https://fal.ai/models/minimax/h3/text-to-video
    timeout_s: 1800
    output: {path: video.url, kind: video}
    notes: >-
      Cheapest verified H3 route among the studio's supported providers. Audio and the first five reference
      images are included. Reference videos and audio inputs are not exposed here.

examples:
  - name: t2v_480p_smoke
    mode: t2v
    prompt: A small red sailboat drifts across a calm lake at sunrise. Gentle ripples and birdsong.
    params: {resolution: "480p", duration: 5}
    smoke: true
    expect: {cost_usd_range: [0.25, 0.25]}
  - name: i2v_768p
    mode: i2v
    prompt: The camera slowly pushes in as wind moves through the grass.
    params: {resolution: "768p", duration: 5}
    media: {start_image: "fixture:images/keyframe.png"}
    expect: {cost_usd_range: [0.30, 0.30]}
  - name: flf2v_2k
    mode: flf2v
    prompt: The day turns to dusk as the camera drifts sideways.
    params: {resolution: "2k", duration: 5}
    media: {start_image: "fixture:images/keyframe.png", end_image: "fixture:images/keyframe.png"}
    expect: {cost_usd_range: [0.65, 0.65]}
  - name: reference_4k
    mode: reference
    prompt: Image 1 shows the landscape. Slowly track across it as birds fly overhead.
    params: {resolution: "4k", duration: 5}
    media: {image_references: ["fixture:images/keyframe.png"]}
    expect: {cost_usd_range: [0.80, 0.80]}
