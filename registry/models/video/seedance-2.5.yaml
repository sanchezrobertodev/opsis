# yaml-language-server: $schema=../../schema/model.schema.json
# Field names verified 2026-10-06: fal per-endpoint OpenAPI and Replicate's bytedance/seedance-2.5 schema.
id: seedance-2.5
name: Seedance 2.5
family: seedance
vendor: bytedance
description: >-
  ByteDance's single-take model (4-30 s) with native audio, omni references, edit and extension.
  Engine behind Higgsfield Cinema Studio 4.0. Rejects real human faces in reference images.
output_type: video
status: active
license_tier: commercial_api
tags: [cinematic, long, references, edit, extend, audio]
prompt: {max_chars: 3000, dialect: seedance, supports_negative: false, dialogue: true}
aspect_ratios: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
duration: {min: 4, max: 30, default: 5}

parameters:
  - {name: duration, label: Duration (s), type: int, min: 4, max: 30, default: 5, ui: slider,
     modes: [t2v, i2v, omni_reference, extend, multi_shot, multi_shot_frame]}
  - {name: shots, label: Shots, type: shots, min_shots: 2, max_shots: 8, min_shot_s: 2, max_shot_s: 30,
     max_total_s: 30, prompt_budget: shared, modes: [multi_shot, multi_shot_frame],
     help: "One continuous take of up to 30 s that cuts between your shots on cue."}
  - {name: resolution, type: enum, options: ["480p", "720p"], default: "720p", ui: segmented}
  - {name: aspect_ratio, label: Aspect, type: enum, options: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"], default: "16:9", ui: aspect, modes: [t2v, omni_reference, multi_shot]}
  - {name: generate_audio, label: Native audio, type: bool, default: true}
  - {name: seed, type: seed, group: advanced}

modes:
  - id: t2v
    label: Text to video
    ops: [t2v]
  - id: i2v
    label: Image to video
    ops: [i2v, flf2v]
    medias:
      - {role: start_image, kinds: [image], label: Start frame, required: true}
      - {role: end_image, kinds: [image], label: End frame (optional)}
  - id: multi_shot
    label: Multi-shot
    ops: [multi_shot]
    prompt: none  # the shots become one timed prompt
  - id: multi_shot_frame
    label: Multi-shot from a frame
    ops: [multi_shot]
    prompt: none
    medias:
      - {role: start_image, kinds: [image], label: First frame, required: true}
  - id: omni_reference
    label: Omni reference
    ops: [multi_ref]
    medias:
      - {role: image_references, kinds: [image], label: Image refs, max: 9}
      - {role: video_references, kinds: [video], label: Video refs, max: 3, max_duration_s: 15}
      - {role: audio_references, kinds: [audio], label: Audio refs, max: 3}
  - id: video_edit
    label: Edit a video
    ops: [instruction_edit, restyle, relight, object_replace]
    medias:
      - {role: input_video, kinds: [video], label: Clip to edit, required: true, max_duration_s: 30, max_mb: 200}
      - {role: image_references, kinds: [image], label: Reference images (optional), max: 9}
  - id: extend
    label: Extend
    ops: [extend]
    medias:
      - {role: input_video, kinds: [video], label: Clip to continue, required: true, max_duration_s: 30, max_mb: 200}

elements: {strategy: refs_native, ref_role: image_references, token: "@Image{n}"}

routes:
  - id: seedance-2.5@replicate
    provider: replicate
    modes:
      t2v: {endpoint: bytedance/seedance-2.5}
      # frames require aspect_ratio "adaptive" (the output follows the image)
      i2v: {endpoint: bytedance/seedance-2.5, fixed: {aspect_ratio: adaptive}}
      multi_shot: {endpoint: bytedance/seedance-2.5}
      multi_shot_frame: {endpoint: bytedance/seedance-2.5, fixed: {aspect_ratio: adaptive}}
    map:
      params:
        shots: {to: prompt, transform: timed_prompt}   # Seedance cuts between shots on cue in one prompt
      media: {start_image: image, end_image: last_frame_image}
    pricing:
      basis: per_output_second
      rates:
        - {when: {resolution: "480p"}, usd: 0.1028}
        - {when: {resolution: "720p"}, usd: 0.2312}
      verified: 2026-10-06
      source: https://replicate.com/bytedance/seedance-2.5
    output: {path: output, kind: video}
    notes: Cheapest route for t2v/i2v. Outputs vanish after 1 hour. Reference inputs cost ~4x per second here.
  - id: seedance-2.5@fal
    provider: fal
    modes:
      t2v: {endpoint: bytedance/seedance-2.5/text-to-video, drop: [seed]}
      i2v: {endpoint: bytedance/seedance-2.5/image-to-video, drop: [seed]}
      multi_shot: {endpoint: bytedance/seedance-2.5/text-to-video, drop: [seed]}
      multi_shot_frame: {endpoint: bytedance/seedance-2.5/image-to-video, drop: [seed]}
      omni_reference: {endpoint: bytedance/seedance-2.5/reference-to-video, fixed: {task: reference}}
      # edits and extensions are tasks on the reference endpoint; editing forces auto length and shape
      video_edit: {endpoint: bytedance/seedance-2.5/reference-to-video, drop: [aspect_ratio],
                   fixed: {task: editing, duration: auto, aspect_ratio: auto}, media: {input_video: "video_urls[]"}}
      extend: {endpoint: bytedance/seedance-2.5/reference-to-video, drop: [aspect_ratio],
               fixed: {task: extension, aspect_ratio: auto}, media: {input_video: "video_urls[]"}}
    map:
      params:
        duration: {to: duration, transform: str}   # fal takes "auto" | "4".."30"
        shots: {to: prompt, transform: timed_prompt}
      media: {start_image: image_url, end_image: end_image_url, image_references: image_urls,
              video_references: video_urls, audio_references: audio_urls}
    pricing:
      # Generation: per output second. Edit/extend are token-priced on input + output seconds (video inputs at
      # 0.6x): about $0.126/s at 480p and $0.284/s at 720p of input plus output.
      basis: per_output_second
      quantity: >-
        input_video_seconds * 2 if mode == 'video_edit'
        else (input_video_seconds + duration if mode == 'extend' else duration * num_outputs)
      rates:
        - {when: {resolution: "480p"}, usd: 0.2205}
        - {when: {resolution: "720p"}, usd: 0.473}
        - {when: {mode: video_edit, resolution: "480p"}, usd: 0.126}
        - {when: {mode: video_edit, resolution: "720p"}, usd: 0.2838}
        - {when: {mode: extend, resolution: "480p"}, usd: 0.126}
        - {when: {mode: extend, resolution: "720p"}, usd: 0.2838}
      verified: 2026-10-06
      source: https://fal.ai/models/bytedance/seedance-2.5/reference-to-video
    output: {path: video.url, kind: video}
    notes: About 2x Replicate for t2v/i2v. Pika is an optional lower-cost route for omni references.

  - id: seedance-2.5@pika
    provider: pika
    modes:
      t2v: {endpoint: bytedance/seedance-2.5/text-to-video, drop: [seed]}
      i2v: {endpoint: bytedance/seedance-2.5/image-to-video, drop: [seed], fixed: {ratio: adaptive}}
      multi_shot: {endpoint: bytedance/seedance-2.5/text-to-video, drop: [seed]}
      multi_shot_frame: {endpoint: bytedance/seedance-2.5/image-to-video, drop: [seed], fixed: {ratio: adaptive}}
      omni_reference: {endpoint: bytedance/seedance-2.5/reference-to-video, drop: [seed],
                       fixed: {omni_reference_task_type: reference}}
      video_edit: {endpoint: bytedance/seedance-2.5/reference-to-video, drop: [seed, aspect_ratio],
                   fixed: {omni_reference_task_type: edit, duration: auto, ratio: adaptive},
                   media: {input_video: "video_urls[]"}}
      extend: {endpoint: bytedance/seedance-2.5/reference-to-video, drop: [seed, aspect_ratio],
               fixed: {omni_reference_task_type: extend, ratio: adaptive}, media: {input_video: "video_urls[]"}}
    map:
      negative_prompt: null
      params:
        aspect_ratio: ratio
        shots: {to: prompt, transform: timed_prompt}
      media: {start_image: image_url, end_image: end_image_url, image_references: image_urls,
              video_references: video_urls, audio_references: audio_urls}
    transform: studio.providers.transforms.pika:seedance
    pricing:
      basis: formula
      # Nominal area, with 12% reservation headroom. Pika's free quote currently reserves ~10% above
      # nominal output cost. Reject quotes above this ceiling; reconcile to settled micro-USD, not tokens.
      formula: >-
        ceil((10044 if resolution == '480p' else 21600) * 1.12 *
        (input_video_seconds * 2 if mode == 'video_edit' else duration + input_video_seconds))
        * (6.72 if input_video_seconds > 0 else 11.235) / 1000000
      verified: 2026-10-25
      source: https://dev.pika.art/models/bytedance/seedance-2.5/reference-to-video/pricing
    output: {path: output.video, kind: video}
    notes: >-
      Optional Pika API Club key and membership required. $11.235/M tokens without video inputs,
      $6.72/M with video inputs; input plus output duration is billed.
      Includes a quote buffer, excludes $10/month membership.
      Only settled job charges enter actual spend. No seed control or remote cancellation.

examples:
  - name: t2v_smoke
    mode: t2v
    prompt: Slow push-in on a lighthouse during a storm, waves crashing, thunder rumbling.
    params: {duration: 4, resolution: "480p"}
    smoke: true
    expect: {cost_usd_range: [0.3, 1.0]}
