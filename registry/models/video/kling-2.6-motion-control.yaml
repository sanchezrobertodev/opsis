# yaml-language-server: $schema=../../schema/model.schema.json
id: kling-2.6-motion-control
name: Kling 2.6 Motion Control
family: kling
vendor: kuaishou
description: >-
  Make a character image perform the movement in a reference clip: dance, gestures, walk cycles. The result
  is as long as the clip (3 to 10 s when it follows the image's framing, up to 30 s when it follows the video's).
output_type: video
status: active
license_tier: commercial_api
tags: [motion-transfer]
prompt: {max_chars: 2500, dialect: kling, supports_negative: true}

parameters:
  - {name: character_orientation, label: Follow the framing of, type: enum, options: [video, image], default: video,
     ui: segmented, help: "Video keeps the clip's camera and framing (up to 30 s). Image keeps your picture's framing (up to 10 s)."}
  - {name: keep_original_sound, label: Keep the clip's sound, type: bool, default: true}

modes:
  - id: transfer
    label: Copy the motion
    ops: [motion_transfer]
    prompt: optional
    medias:
      - {role: character_image, kinds: [image], label: Character, required: true}
      - {role: driving_video, kinds: [video], label: Movement to copy, required: true, max_duration_s: 30, max_mb: 100}

routes:
  - id: kling-2.6-motion-control@runpod
    provider: runpod
    modes:
      transfer: {endpoint: kling-v2-6-std-motion-control}
    map:
      prompt: prompt
      negative_prompt: negative_prompt
      params: {character_orientation: character_orientation, keep_original_sound: keep_original_sound}
      media: {character_image: image, driving_video: video}
    pricing:
      basis: formula
      formula: "ceil(max(driving_video_seconds, 1) / 3) * 0.21"   # $0.21 per started 3 seconds of the clip
      verified: 2026-10-06
      source: https://docs.runpod.io/public-endpoints/models/kling-v2-6-motion-control
    timeout_s: 1800
    output: {path: output.video_url, kind: video}

examples:
  - name: transfer_smoke
    mode: transfer
    params: {character_orientation: video}
    media: {character_image: "fixture:images/keyframe.png", driving_video: "fixture:videos/clip_3s.mp4"}
    smoke: true
    expect: {cost_usd_range: [0.2, 0.45]}
