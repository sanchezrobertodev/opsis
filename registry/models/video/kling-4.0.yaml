# yaml-language-server: $schema=../../schema/model.schema.json
id: kling-4.0
name: Kling 4.0
family: kling
vendor: kuaishou
description: Generate a 3–30 second video at 720p from a text prompt, with native sound and dialogue.
output_type: video
status: active
license_tier: commercial_api
tags: [cinematic, audio]
prompt: {max_chars: 26000, dialect: kling, dialogue: true}
aspect_ratios: &aspects ["16:9", "9:16", "1:1", "21:9", "auto"]
duration: {min: 3, max: 30, default: 5}

parameters:
  - {name: duration, label: Duration (s), type: int, min: 3, max: 30, default: 5, ui: slider}
  - {name: resolution, label: Resolution, type: enum, options: ["720p"], default: "720p", ui: segmented}
  - {name: aspect_ratio, label: Aspect, type: enum, options: *aspects, default: "16:9", ui: aspect}

modes:
  - id: t2v
    label: Text to video
    ops: [t2v]

routes:
  - id: kling-4.0@runway
    provider: runway
    modes:
      t2v: {endpoint: text_to_video, fixed: {model: kling_4}}
    map:
      prompt: promptText
      negative_prompt: null
      passthrough: false
      params:
        duration: duration
        resolution: {to: null}
        aspect_ratio: {to: ratio, transform: enum_map, args: {values:
          {"16:9": "1280:720", "9:16": "720:1280", "1:1": "940:940", "21:9": "1460:624", "auto": "auto_720p"}}}
    pricing:
      basis: formula
      # Reserve at list price (15.7 credits/s, rounded up to a whole credit at $0.01).
      formula: "ceil(duration * 157 / 10) / 100"
      verified: 2026-11-02
      source: https://docs.dev.runwayml.com/guides/pricing/
    charges_on_failure: true  # Runway charges for accepted tasks that fail input moderation.
    output: {path: output, kind: video}
    notes: Estimates use list price. The 720p text-to-video promotion is 12.56 credits per second through November 30, 2026 UTC.

examples:
  - name: t2v_smoke
    mode: t2v
    prompt: A robin lands on a windowsill and chirps twice.
    params: {duration: 3}
    smoke: true
    expect: {cost_usd_range: [0.48, 0.48]}
