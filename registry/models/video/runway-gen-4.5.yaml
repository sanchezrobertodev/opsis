# yaml-language-server: $schema=../../schema/model.schema.json
# Runway API contract verified 2026-10-06 (docs.dev.runwayml.com/openapi.json, version 2024-11-06).
id: runway-gen-4.5
name: Runway Gen-4.5
family: runway
vendor: runway
description: Runway's flagship generator. Strong motion and prompt following, 2-10 s, text or image to video.
output_type: video
status: active
license_tier: commercial_api
tags: [cinematic, motion, image-to-video]
prompt: {max_chars: 1000, dialect: runway}
aspect_ratios: ["16:9", "9:16", "4:3", "1:1", "3:4", "21:9"]
duration: {min: 2, max: 10, default: 5}

parameters:
  - {name: duration, label: Duration (s), type: int, min: 2, max: 10, default: 5, ui: slider}
  - {name: aspect_ratio, label: Aspect, type: enum, options: ["16:9", "9:16", "4:3", "1:1", "3:4", "21:9"], default: "16:9", ui: aspect}
  - {name: seed, type: seed, group: advanced}

rules:
  - when: {mode: t2v, aspect_ratio: ["4:3", "1:1", "3:4", "21:9"]}
    require: {aspect_ratio: ["16:9", "9:16"]}
    message: Gen-4.5 text-to-video is 16:9 or 9:16; other shapes need a start image.

modes:
  - id: t2v
    label: Text to video
    ops: [t2v]
  - id: i2v
    label: Image to video
    ops: [i2v]
    medias:
      - {role: start_image, kinds: [image], label: Start frame, required: true}

routes:
  - id: runway-gen-4.5@runway
    provider: runway
    modes:
      t2v: {endpoint: text_to_video, fixed: {model: gen4.5}}
      i2v: {endpoint: image_to_video, fixed: {model: gen4.5}}
    map:
      prompt: promptText
      negative_prompt: null
      params:
        duration: {to: duration, transform: int}
        aspect_ratio: {to: ratio, transform: enum_map, args: {values:
          {"16:9": "1280:720", "9:16": "720:1280", "4:3": "1104:832", "1:1": "960:960", "3:4": "832:1104", "21:9": "1584:672"}}}
        seed: seed
      media: {start_image: promptImage}
    pricing:
      basis: per_output_second
      rates: [{usd: 0.12}]   # 12 credits/s at $0.01
      verified: 2026-10-06
      source: https://docs.dev.runwayml.com/guides/pricing
    output: {path: output, kind: video}
    notes: Output URLs expire within 24-48 h; ingested immediately.

examples:
  - name: t2v_smoke
    mode: t2v
    prompt: A paper lantern drifts up into a starry night sky over a quiet lake.
    params: {duration: 2}
    smoke: true
    expect: {cost_usd_range: [0.2, 0.3]}
