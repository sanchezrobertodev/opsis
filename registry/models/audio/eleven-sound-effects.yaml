# yaml-language-server: $schema=../../schema/model.schema.json
# Price is the "$0.12 per minute" figure from research 02 (2026-10-06); confirm on the first live run.
id: eleven-sound-effects
name: ElevenLabs Sound Effects
family: elevenlabs
vendor: elevenlabs
description: Short sound effects and ambiences from a description.
output_type: audio
status: active
license_tier: commercial_api
tags: [sfx, foley, ambience]
prompt: {max_chars: 450, dialect: sound}

parameters:
  - {name: duration, type: float, min: 0.5, max: 30, step: 0.5, default: 5}
  - {name: prompt_influence, label: Follow the prompt, type: float, min: 0.0, max: 1.0, step: 0.05, default: 0.3,
     group: advanced, help: Higher sticks closer to the description; lower varies more.}

modes:
  - id: sfx
    label: Sound effect
    ops: [sfx]

routes:
  - id: eleven-sound-effects@elevenlabs
    provider: elevenlabs
    modes:
      sfx: {endpoint: sound-generation}
    map:
      prompt: text
      params:
        duration: duration_seconds
    pricing:
      basis: per_output_second
      rates: [{usd: 0.002}]
      verified: 2026-10-06
      source: https://elevenlabs.io/pricing/api
    output: {path: audio, kind: audio}

examples:
  - name: sfx_smoke
    mode: sfx
    prompt: Heavy wooden door creaking open in a stone hall
    params: {duration: 3}
    smoke: true
    expect: {cost_usd_range: [0.001, 0.02]}
