# yaml-language-server: $schema=../../schema/model.schema.json
# Contract verified 2026-10-06 from fal's OpenAPI (fal-ai/sam-3/video-rle) and its model page ($0.005 per 16 frames).
# Live 2026-10-08: the answer isn't a video but one run-length mask per frame (`rle`), decoded into the matte clip
# on our side; a mask alone isn't a prompt, so the clicks that made it go along, each with its frame.
id: sam-3-video
name: SAM 3 (track through a clip)
family: sam
vendor: meta
description: Follows an object's mask from one frame through the whole clip.
output_type: mask
status: active
license_tier: commercial_api
tags: [segmentation, tracking, mask, object-swap]
prompt: {max_chars: 200, dialect: label}

parameters:
  - {name: frame_index, label: Frame, type: int, min: 0, max: 100000, default: 0,
     help: The frame the mask was drawn on.}
  - {name: detection_threshold, type: float, min: 0.05, max: 1.0, step: 0.05, default: 0.5, group: advanced}
  - {name: points, label: Clicks, type: points, min_points: 1, max_points: 20,
     help: "The clicks that made the mask, on its frame. fal's tracker needs a prompt besides the mask (seen live 2026-10-07)."}

modes:
  - id: track
    label: Track an object
    ops: [track]
    prompt: none
    medias:
      - {role: input_video, kinds: [video], label: Clip, required: true, max_duration_s: 60}
      - {role: mask, kinds: [mask], label: The object on one frame, required: true}

routes:
  - id: sam-3-video@fal
    provider: fal
    modes:
      track: {endpoint: fal-ai/sam-3/video-rle, fixed: {apply_mask: false}}
    map:
      params: {points: point_prompts}
      media: {input_video: video_url, mask: mask_url}
    transform: studio.providers.transforms.segment:sam_points
    pricing:
      basis: formula
      formula: "0.005"  # one unit per request: a 5 s clip was billed $0.005 (fal billing events, 2026-10-08)
      verified: 2026-10-08
      source: https://fal.ai/models/fal-ai/sam-3/video-rle
    eta: "20 + input_video_seconds * 2"
    # fal's schema still lists `video` and `boundingbox_frames_zip`; the live answer is `rle`, `boxes`, `metadata`
    output: {path: rle, kind: mask_video, decode: studio.media.rle:mask_video, unpublished: true}

examples:
  - name: track_smoke
    mode: track
    # the mask comes from SAM 3 image (uploads are never masks), so the smoke script skips this; Object swap runs it
    params: {points: [[0.75, 0.74, 1]]}
    media: {input_video: "fixture:videos/clip_3s.mp4", mask: "made-by:sam-3-image"}
    smoke: true
