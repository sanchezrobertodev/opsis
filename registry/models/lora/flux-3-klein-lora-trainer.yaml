# yaml-language-server: $schema=../../schema/model.schema.json
# Contract verified 2026-11-17 from fal's per-endpoint OpenAPI (blackforestlabs/flux-3/klein/base/trainer) and its
# model page.
id: flux-3-klein-lora-trainer
name: FLUX 3 Klein character LoRA trainer
family: flux
vendor: black-forest-labs
description: >-
  Learns a character's look from 10-80 photos (fal's FLUX 3 Image Klein base trainer; it writes no captions, so the
  trigger word captions every photo) and returns a LoRA that FLUX 3 Klein stills load when you @mention the
  character. The lora_train recipe runs it from a character's pictures.
output_type: lora
status: active
license_tier: commercial_api
tags: [characters, identity, training]

parameters:
  - {name: trigger_phrase, label: Trigger word, type: text, max_chars: 40,
     help: "A made-up word the LoRA learns as this character; the studio writes it into prompts that mention them."}
  - {name: steps, label: Training steps, type: int, min: 100, max: 3000, step: 100, default: 1000, ui: slider,
     help: "More steps learn the face more closely and cost more ($0.0043 a step, 100 at least)."}
  - {name: resolution, label: Training size, type: enum, options: [512, 768, 1024], default: 1024, group: advanced,
     help: "The size the photos are learned at, keeping their shape."}

modes:
  - id: character
    label: Train a character
    ops: [lora_train]
    prompt: none
    medias:
      - {role: training_data, kinds: [archive], label: Photos (zip), required: true}

routes:
  - id: flux-3-klein-lora-trainer@fal
    provider: fal
    modes:
      character: {endpoint: blackforestlabs/flux-3/klein/base/trainer}
    map:
      params:
        trigger_phrase: trigger_phrase
        steps: steps
        resolution: resolution
      media: {training_data: images_data_url}
    pricing:
      basis: per_request
      quantity: "max(100, steps)"
      rates: [{usd: 0.0043}]
      verified: 2026-11-17
      source: "https://fal.ai/models/blackforestlabs/flux-3/klein/base/trainer/llms.txt ($0.0043 per training step, minimum 100 steps; 1000 steps $4.30)"
    timeout_s: 7200
    # one file (the base model has a single transformer); its config file isn't kept
    output:
      path: lora_file.url
      kind: lora
      meta: {base: flux-3-klein}

examples:
  - name: character_smoke
    mode: character
    # the zip comes from the lora_train recipe's dataset step, so the smoke script skips this
    params: {trigger_phrase: mayaxq, steps: 1000}
    media: {training_data: "made-by:lora_train"}
    smoke: true
    expect: {cost_usd_range: [4.3, 4.3]}
