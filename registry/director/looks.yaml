# Cinema "look" vocabulary for the director panel (Cinema Studio-style controls). Each item is a phrase the
# dialects weave into the prompt. Generic descriptors on purpose: no camera or film brand names.
shot_sizes:
  - {id: extreme_wide, label: Extreme wide, prompt: "extreme wide shot"}
  - {id: wide, label: Wide, prompt: "wide shot"}
  - {id: full, label: Full, prompt: "full shot showing the whole body"}
  - {id: medium_wide, label: Medium wide, prompt: "medium wide shot from the knees up"}
  - {id: medium, label: Medium, prompt: "medium shot from the waist up"}
  - {id: medium_close, label: Medium close-up, prompt: "medium close-up"}
  - {id: close_up, label: Close-up, prompt: "close-up"}
  - {id: extreme_close_up, label: Extreme close-up, prompt: "extreme close-up"}
  - {id: insert, label: Insert detail, prompt: "insert shot of a small detail"}

angles:
  - {id: eye_level, label: Eye level, prompt: "eye-level angle"}
  - {id: low, label: Low angle, prompt: "low angle looking up"}
  - {id: high, label: High angle, prompt: "high angle looking down"}
  - {id: birds_eye, label: Bird's eye, prompt: "bird's-eye view from directly above"}
  - {id: worms_eye, label: Worm's eye, prompt: "worm's-eye view from the ground"}
  - {id: over_shoulder, label: Over the shoulder, prompt: "over-the-shoulder angle"}
  - {id: pov, label: Point of view, prompt: "first-person point of view"}
  - {id: profile, label: Profile, prompt: "side profile angle"}

