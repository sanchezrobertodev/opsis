# The emotion wheel: eight families, each mild (1), plain (2) and intense (3). `{subject}` is the subject, or the
# @character the emotion is set for.
emotions:
  - {id: calm, label: Serenity, family: joy, level: 1, prompt: "{subject} is serene and calm"}
  - {id: joy, label: Joy, family: joy, level: 2, prompt: "{subject} radiates joy"}
  - {id: ecstasy, label: Ecstasy, family: joy, level: 3, prompt: "{subject} is overcome with ecstatic delight"}
  - {id: acceptance, label: Acceptance, family: trust, level: 1, prompt: "{subject} is open and accepting"}
  - {id: trust, label: Trust, family: trust, level: 2, prompt: "{subject} looks on with trust and warmth"}
  - {id: love, label: Love, family: trust, level: 3, prompt: "{subject} looks on with deep tenderness"}
  - {id: apprehension, label: Apprehension, family: fear, level: 1, prompt: "{subject} is uneasy and apprehensive"}
  - {id: fear, label: Fear, family: fear, level: 2, prompt: "{subject} is gripped by fear"}
  - {id: terror, label: Terror, family: fear, level: 3, prompt: "{subject} is frozen in terror"}
  - {id: distraction, label: Distraction, family: surprise, level: 1, prompt: "{subject} is distracted, attention drifting"}
  - {id: surprise, label: Surprise, family: surprise, level: 2, prompt: "{subject} reacts with surprise"}
  - {id: amazement, label: Amazement, family: surprise, level: 3, prompt: "{subject} is struck with amazement"}
  - {id: pensive, label: Pensiveness, family: sadness, level: 1, prompt: "{subject} is pensive and withdrawn"}
  - {id: sadness, label: Sadness, family: sadness, level: 2, prompt: "{subject} is quietly sad"}
  - {id: grief, label: Grief, family: sadness, level: 3, prompt: "{subject} is wracked with grief"}
  - {id: boredom, label: Boredom, family: disgust, level: 1, prompt: "{subject} is bored and listless"}
  - {id: disgust, label: Disgust, family: disgust, level: 2, prompt: "{subject} recoils in disgust"}
  - {id: loathing, label: Loathing, family: disgust, level: 3, prompt: "{subject} glares with loathing"}
  - {id: annoyance, label: Annoyance, family: anger, level: 1, prompt: "{subject} is visibly annoyed"}
  - {id: anger, label: Anger, family: anger, level: 2, prompt: "{subject} seethes with anger"}
  - {id: rage, label: Rage, family: anger, level: 3, prompt: "{subject} explodes in rage"}
  - {id: interest, label: Interest, family: anticipation, level: 1, prompt: "{subject} watches with quiet interest"}
  - {id: anticipation, label: Anticipation, family: anticipation, level: 2, prompt: "{subject} waits in eager anticipation"}
  - {id: determination, label: Determination, family: anticipation, level: 3, prompt: "{subject} is fiercely determined"}
