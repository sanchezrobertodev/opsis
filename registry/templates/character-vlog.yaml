id: character-vlog
name: Character vlog
summary: The person in your picture stars in a short talking vlog about your idea, with cutaways, music and captions.
recipe: vlog
inputs:
  - {key: character_image, kind: image, label: A clear picture of the person, alternative: true}
  - {key: character, kind: character, label: Or one of your saved characters, alternative: true}
fields:
  - key: idea
    label: What the vlog is about
    placeholder: a rainy Sunday at the flower market
    max_chars: 500
  - key: name
    label: Their name
    placeholder: Ana
    required: false
    max_chars: 60
input:
  idea: "{idea}"
  name: "{name}"
  shots: 5
  aspect_ratio: "9:16"
tags: [character, lipsync, vertical]
