id: runpod_wan_core
name: Your RunPod (wan-core)
kind: selfhosted
adapter: runpod_comfy
# Both must be set: the RunPod key and the endpoint id printed when the endpoint was created.
key_setting: [runpod_api_key, runpod_wan_core_endpoint]
endpoint_setting: runpod_wan_core_endpoint
concurrency: 2             # matches the endpoint's max workers
poll_min_seconds: 4
docs: infra/runpod/wan-core/README.md
notes: >-
  Your own RunPod serverless endpoint running ComfyUI with Wan 2.2 14B, Fun Camera and Wan-Move (infra/runpod/wan-core).
  It scales to zero: you pay per second while a worker runs, and the first clip after a pause also loads the model.
  Inputs are hosted through fal storage, so set FAL_KEY too (small images go inline without it).
# Serverless flex prices, USD per hour (get-gpu-type, 2026-10-06). The worker reports which GPU it ran on.
gpu_usd_per_hour:
  RTX PRO 6000: 3.49
  H100: 4.79
  L40S: 1.75
  A40: 1.22
# Videos and audio must be web links; they're hosted through fal storage, so these routes need FAL_KEY.
# Images under 6 MB go inline without it.
hosted_kinds: [video, audio]
hosting_setting: fal_key
