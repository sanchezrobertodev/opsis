# Starter characters the Characters page offers (studio/characters/traits.py, GET /characters/catalog). Each one's
# portrait is apps/web/public/starters/characters/<id>.webp (1024 px), kept as its first picture when added.
# `traits` are designer picks as saved in `attributes.traits` (options from traits.yaml; several picks as "a, b"),
# `style` a catalog style id (registry/styles/), `voice_id` one of the voice model's `voice_id` options.
# A starter that doesn't fit the vocabulary fails the load, saying which.

voice_model: eleven-v4

starters:
