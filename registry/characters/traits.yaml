# The character designer's vocabulary (studio/characters/traits.py, GET /characters/catalog): the presentations, then
# a person's traits and a creature's, in the order the designer shows them. Saved characters keep the option strings
# in `attributes.traits` (several picks of a `multi` trait as "a, b"), so never reword an option: add a new one.
#
# Every option has a picture, apps/web/public/designer/<set>/<key>-<slug>.webp (256 px) and the same under full/
# (768 px). The set is the presentation as a slug (`man`, `woman`, `androgynous-person`, `non-human-creature`; the
# Presentation row uses the man's); the slug is the option in lowercase with each run of other characters a hyphen
# ("pilot's flight suit" -> pilot-s-flight-suit). tests/unit/test_characters.py checks them.
#
# `phrase` is how a pick reads in the description: {o} is the option, {a} the option after "a" or "an" (none before a
# plural or mass noun); `overrides` words single options instead. A trait without a phrase is worded with others in
# code: age with the presentation, hair with its color, a creature's temperament, life stage, size and body shape as
# one noun, its features with its eyes. The expression's phrase words the designer's own pictures (the portrait, Try
# in Create image) and never the saved description, which every @mention carries: it would fix the face for every shot.

presentations: [woman, man, androgynous person, non-human creature]

person:
  - key: age
    label: Age
    options: [young, teenage, twenty-something, thirty-something, middle-aged, elderly]
  - key: build
    label: Build
    phrase: "{o} build"
    options: [slight, athletic, average, broad, heavyset, very tall]
  - key: hair
    label: Hair
    options: [short curly, long straight, shaved, braided, messy shoulder-length, slicked back, bald]
  - key: hair_color
    label: Hair color
    options: [black, dark brown, auburn, blonde, silver, dyed blue, bright red]
  - key: eyes
    label: Eyes
    phrase: "{o} eyes"
    options: [brown, hazel, green, blue, grey, amber]
  - key: expression
    label: Expression
    phrase: "a {o} expression"
    options: [smiling, serious, smirking, surprised, tired, determined]
  - key: outfit
    label: Outfit
    phrase: "wearing {a}"
    options: [worn leather jacket, tailored suit, streetwear hoodie, flowing robe, spacesuit, work overalls]
    by_presentation:  # each presentation's own outfits, after the shared ones (with none picked, the man's show)
      man: [plate armour, cowboy duster, naval uniform]
      woman: [evening dress, pilot's flight suit, fencing whites]
      androgynous person: [long trench coat, lab coat, desert nomad wraps]
  - key: accessory
    label: Accessory
    phrase: "with {a}"
    overrides: {headphones: with headphones around the neck}
    options: [wide-brimmed hat, knit beanie, headphones, wool scarf, pendant necklace, bandana]
  - key: palette
    label: Colors
    phrase: "dressed in {o}"
    options: [earth tones, all black, soft pastels, bold primaries, crisp white, jewel tones]
  - key: detail
    label: Signature detail
    phrase: "{o}"
    options: [scar across one eyebrow, freckles, round glasses, facial tattoo, eye patch, silver earrings, missing tooth]
  - key: archetype
    label: Archetype
    phrase: "the look of {a}"
    options: [hero, rebel, mentor, trickster, villain, everyday person]

creature:
  - key: body
    label: Body shape
    options: [two-legged, four-legged, six-legged, winged, snake-like, finned, tentacled, blob-like, plant-like,
              golem-like]
  - key: likeness
    label: Animal likeness
    phrase: "resembling {a}"
    options: [wolf, fox, big cat, bear, owl, lizard, frog, octopus, moth, beetle, deer, shark]
  - key: size
    label: Size
    options: [pocket-sized, cat-sized, human-sized, horse-sized, towering]
  - key: stage
    label: Life stage
    options: [baby, young, adult, ancient]
  - key: covering
    label: Covering
    phrase: "covered in {o}"
    options: [fur, scales, feathers, chitin, smooth skin, bark and moss, crystal, armour plates, translucent jelly]
  - key: coloring
    label: Coloring
    phrase: "{o} coloring"
    options: [camouflage, striped, spotted, iridescent, bioluminescent, pale, two-tone, vivid]
  - key: features
    label: Features (pick any number)
    multi: true
    options: [horns, antlers, neck frill, tusks, beak, mandibles, wings, clubbed tail, extra arms]
  - key: eyes
    label: Eyes
    options: [two eyes, single eye, many eyes, eyestalks, no visible eyes, glowing eyes]
  - key: temperament
    label: Temperament
    options: [adorable, majestic, eerie, fearsome, comical, wise]
  - key: habitat
    label: Habitat
    phrase: "from {o}"
    options: [forests, deserts, the deep sea, arctic ice, volcanic lands, caves, high skies, swamps]
  - key: gear
    label: Gear
    phrase: "wearing {a}"
    options: [pack harness, rider's saddle, battle armour, jewelled collar, robes, tech implants]
