# Wan 2.2 TI2V 5B, one graph for text-to-video and image-to-video.
# Based on ComfyUI's Wan 2.2 5B template (validated 2026-09-07 on a 12 GB GPU:
# draft 768x448/73f ~66-71 s, standard 1280x704/121f ~400-461 s). Uses tiled VAE decode so 12 GB doesn't run out.
description: Wan 2.2 TI2V 5B (fp16) with tiled decode
inputs:
  prompt: [{node: "6", input: text}]
  # The template keeps Wan's official negative prompt; user text is appended to it.
  negative_prompt: [{node: "7", input: text, mode: append}]
  seed: [{node: "3", input: seed}]
  steps: [{node: "3", input: steps}]
  width: [{node: "55", input: width}]
  height: [{node: "55", input: height}]
  length: [{node: "55", input: length}]
  fps: [{node: "57", input: fps}]
  start_image: [{node: "56", input: image}]
  filename_prefix: [{node: "58", input: filename_prefix}]
  lora: [{node: "90", input: lora_name}]
  lora_strength: [{node: "90", input: strength_model}]
optional:
  # Text-to-video: no start image, so drop the loader and its link into the latent.
  start_image: {node: "56", unlink: [{node: "55", input: start_image}]}
  # No LoRA picked: drop the loader and feed the model straight on.
  lora: {node: "90", bypass: [model]}
outputs:
  - {node: "58", kind: video}
