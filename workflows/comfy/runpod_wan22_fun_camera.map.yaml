# Wan 2.2 Fun Camera 14B, a start frame plus a preset camera move
# Runs on the wan-core RunPod endpoint (infra/runpod/wan-core); its models.yaml lists the model files.
# Source: ComfyUI's official template video_wan2_2_14B_fun_camera (comfyui_workflow_templates 0.11.48), Lightning path:
# 4 steps split 2+2 across the high/low-noise experts, cfg 1, 16 fps. Checked against ComfyUI 0.34 /object_info.
description: Wan 2.2 Fun Camera 14B, a start frame plus a preset camera move
# camera_pose is one of: Static, Pan Up, Pan Down, Pan Left, Pan Right, Zoom In, Zoom Out, Anti Clockwise (ACW),
# ClockWise (CW). Size and length are set on the camera node; the video node reads them from it.
inputs:
  prompt: [{node: "9", input: text}]
  negative_prompt: [{node: "10", input: text, mode: append}]
  seed: [{node: "13", input: noise_seed}]
  camera_pose: [{node: "18", input: camera_pose}]
  camera_speed: [{node: "18", input: speed}]
  width: [{node: "18", input: width}]
  height: [{node: "18", input: height}]
  length: [{node: "18", input: length}]
  start_image: [{node: "11", input: image}]
  filename_prefix: [{node: "17", input: filename_prefix}]
outputs:
  - {node: "17", kind: video}
