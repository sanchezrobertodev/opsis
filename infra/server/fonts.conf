<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The Faceless caption looks name Windows fonts (registry/faceless/styles.yaml). On the home server libass finds
     these open stand-ins instead: Liberation is metric-compatible with Arial and Courier New, Comic Neue is drawn
     after Comic Sans, and DejaVu covers the humanist sans faces. -->
<fontconfig>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Comic Sans MS</family><prefer><family>Comic Neue</family></prefer></alias>
  <alias binding="same"><family>Trebuchet MS</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Impact</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
