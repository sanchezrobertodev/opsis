# Model files for the wan-core workflows (workflows/comfy/runpod_*.json), fetched onto the network volume
# at /runpod-volume/models/<folder>/<name> by fetch_models.py. Sizes are exact (Hugging Face, 2026-10-06), so a
# truncated download is caught. URLs come from the official ComfyUI templates (comfyui_workflow_templates 0.11.48).
# Groups: core = Wan 2.2 14B image-to-video + shared encoders; camera = Fun Camera moves;
# move = Wan-Move point trajectories (Wan 2.1 14B, 480p); vace = masked edits (Wan 2.1 VACE 14B, CausVid LoRA);
# animate2 = Wan Animate-2 motion transfer (distilled, int8; reuses the text encoder, clip vision and VAE above);
# uni3c = camera copied from a reference clip (Uni3C ControlNet on the core Wan 2.2 experts). Sizes for the last three
# groups checked 2026-10-08. Licenses: Wan 2.1/2.2, Fun, Wan-Move, VACE, Animate, Uni3C, lightx2v, CausVid are Apache 2.0.
# ltx = LTX-2.5 22B distilled (int8) with its Gemma 4 12B text encoder, video and audio VAEs and x2 latent upscaler,
# the open default for text and image to video since 2026-10-10 (sizes from the Hugging Face tree API that day). The
# repo is gated: accept the license at huggingface.co/Lightricks/LTX-2.5 and pass HF_TOKEN to the fetcher. License:
# LTX-2.x Community License (free, commercial use under $10M yearly revenue). The Wan 2.2 text-to-video group (31 GB)
# was dropped the same day; LTX-2.5 replaced it.
# Your own ComfyUI runs these graphs too (fetch_models.py --local). `local_only` entries are never fetched onto the
# volume: the two models only the local engine runs (wan5b, flux-klein; sizes checked 2026-10-30) and wan-shared, the
# Wan text encoder, VAE and clip vision on their own, so a PC fetching VACE or Animate-2 skips core's 14B experts. A file
# several groups need is listed once per group; the fetcher fetches it once.
